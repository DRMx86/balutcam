name: BalutCam
options:
  bundleIdPrefix: com.drmx86
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    PRODUCT_NAME: BalutCam
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

targets:
  BalutCam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - BalutCam
    resources:
      - path: BalutCam/Assets.xcassets
      - path: BalutCam/Preview\\ Content
    info:
      path: BalutCam/Info.plist
      properties:
        CFBundleDisplayName: BalutCam
        CFBundleIdentifier: com.drmx86.BalutCam
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "BalutCam uses the camera to capture photos and videos with film-inspired LUT effects."
        NSPhotoLibraryUsageDescription: "BalutCam imports your existing media so you can apply LUTs and save edited versions."
        NSPhotoLibraryAddUsageDescription: "BalutCam saves processed photos and videos to your photo library."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
