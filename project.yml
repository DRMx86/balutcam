name: BalutCam

options:
  bundleIdPrefix: com.drmx86
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: BalutCam
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  BalutCam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BalutCam
      - path: LUTs
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drmx86.BalutCam
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: BalutCam
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Exposes Documents/ in the Files app so users can drop .cube files in Documents/LUTs
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: BalutCam uses the camera to capture photos and videos with film-inspired LUT effects.
        NSMicrophoneUsageDescription: BalutCam records audio with your videos.
        NSPhotoLibraryAddUsageDescription: BalutCam saves processed photos and videos to your photo library.
        NSPhotoLibraryUsageDescription: BalutCam reads photos and videos you choose so you can apply looks to them.
