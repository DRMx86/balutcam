name: ios-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project BalutCam.xcodeproj \
            -scheme BalutCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*(deprecated)|BUILD (SUCCEEDED|FAILED)" || true
          test -d .build/DerivedData/Build/Products/Release-iphoneos/BalutCam.app \
            || { echo "Build failed, last log lines:"; tail -60 build.log; exit 1; }

      - name: Package unsigned IPA
        run: |
          mkdir -p artifacts/Payload
          cp -R .build/DerivedData/Build/Products/Release-iphoneos/BalutCam.app artifacts/Payload/
          cd artifacts && zip -qry BalutCam-unsigned.ipa Payload && rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BalutCam-unsigned-ipa
          path: artifacts/BalutCam-unsigned.ipa
          retention-days: 14
